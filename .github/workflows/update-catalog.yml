name: Actualiser catalogue Anime-Sama

on:
  workflow_dispatch:
  schedule:
    - cron: "14 5 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dependances
        run: python -m pip install requests beautifulsoup4 rapidfuzz
      - name: Reconstruire les catalogues
        run: python scripts/build_catalog.py
      - name: Publier les changements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs scripts/imdb-cache.json
          git diff --cached --quiet || (git commit -m "chore: refresh Anime-Sama catalogs" && git push)
