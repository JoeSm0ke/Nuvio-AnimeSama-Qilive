name: Actualiser catalogue Anime-Sama

on:
  workflow_dispatch:
  schedule:
    - cron: "14 5 * * 1,4"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Installer les dependances isolees
        run: python -m pip install -r scripts/requirements-catalog.txt
      - name: Tests de non-regression avant actualisation
        run: python -m unittest discover -s scripts -p 'test_catalog_maintenance.py' -v
      - name: Index complet des titres Anime-Sama
        run: python scripts/build_site_index.py
      - name: Reconstruire uniquement les rayons verifies
        run: python scripts/build_catalog.py
      - name: Actualiser les classiques
        run: python scripts/build_classics.py
      - name: Synchroniser les rayons thematiques
        run: python scripts/build_genre_catalogs.py
      - name: Audit de TOUT le catalogue avant publication
        run: npm run audit:catalog
      - name: Publier uniquement si tous les controles ont reussi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/catalog/series docs/manifest.json scripts/genre-metadata-cache.json
          git diff --cached --quiet || (git commit -m "chore: refresh validated Anime-Sama catalogs" && git push)
