name: Catalog integrity

on:
  push:
    paths:
      - "docs/catalog/series/**"
      - "docs/manifest.json"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/catalog-integrity.yml"
  pull_request:
    paths:
      - "docs/catalog/series/**"
      - "docs/manifest.json"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/catalog-integrity.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Isolated catalog script dependencies
        run: python -m pip install -r scripts/requirements-catalog.txt
      - name: Unit tests (offline fixtures)
        run: python -m unittest discover -s scripts -p 'test_catalog_maintenance.py' -v
      - name: Public metadata integrity (offline)
        run: npm run audit:catalog
